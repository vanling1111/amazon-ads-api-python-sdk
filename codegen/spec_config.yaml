# Amazon Ads API SDK - Spec Configuration
# Controls which specs are used for code generation, how they map to modules,
# and their API tier classification.
#
# generate: true   -> generate models + clients
# generate: false  -> skip (keep spec file for reference)
# generate: delete -> spec is empty/obsolete, should be removed

specs:
  # ══════════════════════════════════════════
  # Sponsored Products (SP)
  # ══════════════════════════════════════════
  - file: SponsoredProducts_prod_3p.json
    module: sp
    tier: L1
    generate: true

  - file: SponsoredProducts_v2_openapi.yaml
    module: sp_v2
    tier: L1
    generate: false
    note: "Legacy v2 spec, superseded by prod_3p (v3)"

  # ══════════════════════════════════════════
  # Sponsored Brands (SB)
  # ══════════════════════════════════════════
  - file: SponsoredBrands_v4_openapi.json
    module: sb
    tier: L1
    generate: true
    priority: 1

  - file: SponsoredBrands_prod_3p.json
    module: sb_legacy
    tier: L1
    generate: false
    note: "v3+v4 mixed, v4_openapi is preferred"

  - file: SponsoredBrands_v3_openapi.yaml
    module: sb_v3
    tier: L1
    generate: false
    note: "Legacy v3, superseded by v4"

  - file: SponsoredBrandsCategoryBenchmark_prod_3p.json
